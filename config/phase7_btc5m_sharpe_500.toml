# Phase 7 Sharpe-first launch profile for a ~$500 bankroll.
# This profile is paper-safe by default. Switch `mode = "live"` only after
# validating fills, inventory behavior, and rate/fee handling in paper/shadow.
#
# Implemented runtime mapping:
# - BTC-only, 5m-only market selection
# - 5s 5m warmup after market open
# - buy ladder anchored to best bid / best bid - 1 tick
# - daily + session loss stops
# - Phase 6 directional size skew from spot / flow / book imbalance
#
# Set `directional_skew_enabled = false` below to flip back to a symmetric profile
# without rebuilding the bot.

[general]
mode = "paper"
db_path = "data/polymarket-arb.db"
eoa_mode = true
canary_mode = false
canary_periods = 99999

[strategy]
min_profit_threshold = "0.01"
max_combined_bid = "0.99"
order_size_usdc = "5.00"
max_orders_per_side = 2
ticks_below_mid = 1
aggressiveness = "0.50"

[risk]
max_position_per_market = "60.00"
max_total_exposure = "225.00"
max_imbalance_ratio = "0.60"
pause_imbalance_ratio = "0.70"
emergency_imbalance_ratio = "0.80"
daily_loss_limit = "10.00"
session_loss_limit = "5.00"
resolution_safety_margin_secs = 15

[timing]
max_book_age_ms = 1500
quote_refresh_ms = 2000
health_check_interval_secs = 5
market_discovery_interval_secs = 10

[alerting]
enabled = false
max_alerts_per_5min = 5

[v2]
target_combined = "0.97"
min_bid = "0.02"
max_combined_avg_cost = "0.99"
light_side_max_combined = "0.99"
merge_min_profit_per_pair = "0.00"

max_share_imbalance = "18.0"
soft_imbalance_threshold = "10.0"
